name: Cantilever ILSpy Store Bootstrap

on:
  push:
    branches:
      - work/cantilever-bootstrap-20260908
    paths:
      - '.github/workflows/cantilever-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Install and pack ILSpy tool store
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/bootstrap-tools"
          dotnet tool install ilspycmd --tool-path "$GITHUB_WORKSPACE/bootstrap-tools"
          "$GITHUB_WORKSPACE/bootstrap-tools/ilspycmd" --version
          test -d "$GITHUB_WORKSPACE/bootstrap-tools/.store"
          tar -C "$GITHUB_WORKSPACE/bootstrap-tools" -czf "$GITHUB_WORKSPACE/ilspy-store.tar.gz" .store
          ls -lh "$GITHUB_WORKSPACE/ilspy-store.tar.gz"

      - name: Upload ILSpy store
        uses: actions/upload-artifact@v4
        with:
          name: cantilever-ilspy-store
          path: ilspy-store.tar.gz
          if-no-files-found: error
          compression-level: 0

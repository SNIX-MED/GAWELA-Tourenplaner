name: Cantilever Offline Build Kit

on:
  push:
    branches:
      - work/cantilever-bootstrap-20260908
    paths:
      - '.github/workflows/cantilever-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Checkout Smartstore 6.4.0
        uses: actions/checkout@v4
        with:
          repository: smartstore/Smartstore
          ref: 6.4.0
          path: smartstore

      - name: Build Smartstore references
        shell: bash
        run: |
          set -euo pipefail
          dotnet build smartstore/src/Smartstore.Web/Smartstore.Web.csproj -c DebugNoRazorCompile -p:RazorCompileOnBuild=false -p:RazorCompileOnPublish=false
          WEB_DLL="$(find smartstore/src/Smartstore.Web -path '*/bin/*' -name Smartstore.Web.dll -type f | head -n 1)"
          test -n "$WEB_DLL"
          WEB_OUT="$(dirname "$WEB_DLL")"
          echo "Smartstore Web output: $WEB_OUT"
          find "$WEB_OUT" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | sed -n '1,30p'
          tar -C "$WEB_OUT" -czf "$GITHUB_WORKSPACE/smartstore-refs.tar.gz" .
          ls -lh "$GITHUB_WORKSPACE/smartstore-refs.tar.gz"

      - name: Pack SDK build components
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DOTNET_ROOT/sdk/10.0.302"
          test -d "$DOTNET_ROOT/packs"
          ITEMS=(sdk/10.0.302 packs)
          [ ! -d "$DOTNET_ROOT/sdk-manifests" ] || ITEMS+=(sdk-manifests)
          [ ! -d "$DOTNET_ROOT/metadata" ] || ITEMS+=(metadata)
          tar -C "$DOTNET_ROOT" -czf "$GITHUB_WORKSPACE/dotnet-sdk-build-parts.tar.gz" "${ITEMS[@]}"
          ls -lh "$GITHUB_WORKSPACE/dotnet-sdk-build-parts.tar.gz"

      - name: Upload SDK build components
        uses: actions/upload-artifact@v4
        with:
          name: cantilever-dotnet-sdk-build-parts
          path: dotnet-sdk-build-parts.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Upload Smartstore references
        uses: actions/upload-artifact@v4
        with:
          name: cantilever-smartstore-refs
          path: smartstore-refs.tar.gz
          if-no-files-found: error
          compression-level: 0
